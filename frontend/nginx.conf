server {
    listen 80;
    server_name 192.168.13.128; # Thay bằng domain của bạn nếu có

    # Tự động chuyển hướng từ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 192.168.13.128;

    # Đường dẫn đến file cert đã mount từ Secret vào Deployment
    ssl_certificate     /etc/nginx/ssl/smashshop.com/smashshop.com.crt;
    ssl_certificate_key /etc/nginx/ssl/smashshop.com/smashshop.com.key;

    # Tối ưu hóa bảo mật SSL
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cấu hình cho mã nguồn Frontend (React/Vue/Angular)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # Quan trọng cho Single Page App (SPA)
    }

    # --- PHẦN QUAN TRỌNG: Sửa lỗi kết nối Database (qua Backend) ---
    # Giả sử Frontend gọi API qua đường dẫn /api
    location /api/ {
        # 'backend-service' là tên của Service Kubernetes của Backend
        # '8080' là cổng mà Backend đang lắng nghe
        proxy_pass http://192.168.13.128:30003;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trang lỗi
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}