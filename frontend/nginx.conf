server {
    listen 80;
    server_name 192.168.13.128;

    location / {
        return 301 https://$host:30444$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 192.168.13.128;

    
    ssl_certificate     /etc/nginx/ssl/smashshop.com/smashshop.com.crt;
    ssl_certificate_key /etc/nginx/ssl/smashshop.com/smashshop.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
    
        proxy_pass http://smashshop-backend-service.application-deployment.svc.cluster.local:80;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}